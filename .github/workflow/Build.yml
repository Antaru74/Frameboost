name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ZIP_NAME: frameboost-lsp.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip -q "$ZIP_NAME" -d src_extracted
          SETTINGS=$(find src_extracted -maxdepth 3 -name settings.gradle | head -n 1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FrameBoostLSP-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
